{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title></title>
    <meta name="description" content="">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block css %}
    {% endblock %}
</head>

<body>
    <div class="wrapper">
        <header>
            <div id="arrow">
                <a href="{{ back_url|default:'#' }}">
                    <span class="dli-arrow-left"></span>
                </a>
            </div>
            <h1 class="page_title">
                {% block page_title %}
                {% endblock %}
            </h1>
        </header>
        {% block content %}
        {% endblock %}
        <footer>
            {% block footer %}
            {% endblock %}
        </footer>
    </div>
</body>

</html>
