<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title></title>
    <meta name="description" content="">
    {% load static %}
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link href="{%static 'css/authn_page.css'%}" rel="stylesheet">
  </head>
    
<body>
  <h1 class="title">{{ page_title }}</h1>
    <form action="#" method="post" name="go_to_success">
      {% csrf_token %}
      {% for field in form %}
      <div class="form-item">
        <p>{{ field.label }}</p>
        <p>{{ field }}</p>
      </div>
      {% endfor %}
      <div class="form-item">
        <p id="submit_wrapper"><input type="submit" value="{{ submit_button_text }}" name="authn_page_form"></p>
      </div>
    </form>
  <p id="navigation-wrapper"><a href="{% url navigated_page_name  %}">{{ navigated_link_text }}</a></p>
  {{ message }}
</body>

</html>
