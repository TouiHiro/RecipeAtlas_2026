<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title></title>
        <meta name="description" content="">
    </head>
    <body>
        <h1>tesu</h1>
        <h1>レシピ一覧</h1>
    <ul>
        {% for recipe in recipes %}
        <li>
            <a href="{% url 'recipes:recipe_detail' recipe.recipe_id %}">
            {{ recipe.recipe_title }}
            </a><br>
            <img src="{{recipe.recipe_img.url}}" alt="" width="200px">
            {{recipe.recipe_detail}}
            {{ recipe.created_at }}
        </li>
        {% empty %}
        {% endfor %}
    </ul>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <!-- form.as_p フィールド情報をpタグで囲って出力 -->
    {{ form.as_p }}
    <button type="submit">送信</button>
</form>
<script>
</script>
        
    </body>
</html>
